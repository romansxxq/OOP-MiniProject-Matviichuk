name: MedCore CI Pipeline

# CI буде запускатися при кожному push або pull request у гілку main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'

    - name: Restore dependencies
      run: dotnet restore 

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Tests with Coverage
      run: dotnet test --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

    - name: Coverage Summary
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        export PATH="$PATH:$HOME/.dotnet/tools"
        reportgenerator -reports:**/coverage.opencover.xml -targetdir:coverage-report -reporttypes:TextSummary
        cat coverage-report/Summary.txt

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Console App
      run: dotnet publish src/MedCore.Console/MedCore.Console.csproj --configuration Release --runtime win-x64 --self-contained false --output publish/MedCore.Console

    - name: Package Publish Output
      run: |
        cd publish
        zip -r ../medcore-publish.zip .

    - name: Upload Publish Artifact
      uses: actions/upload-artifact@v4
      with:
        name: medcore-publish
        path: medcore-publish.zip

    - name: Create or Update GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="build-${{ github.run_number }}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" medcore-publish.zip --clobber
        else
          gh release create "$TAG" medcore-publish.zip --title "Build $TAG" --notes "Automated build from $GITHUB_SHA" --target "$GITHUB_SHA"
        fi
