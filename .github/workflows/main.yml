name: MedCore CI Pipeline

# CI буде запускатися при кожному push або pull request у гілку main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'

    - name: Restore dependencies
      run: dotnet restore 

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Tests with Coverage
      run: dotnet test --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

    - name: Coverage Summary
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        export PATH="$PATH:$HOME/.dotnet/tools"
        reportgenerator -reports:**/coverage.opencover.xml -targetdir:coverage-report -reporttypes:TextSummary
        cat coverage-report/Summary.txt

    - name: Publish Release Artifact
      run: dotnet publish src/MedCore.Console -c Release -r win-x64 --self-contained true -o publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MedCore-win-x64
        path: publish/**
